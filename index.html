
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f2f4ff;color:#222}
header{background:#5146e5;color:white;padding:24px;text-align:center}
main{max-width:700px;margin:auto;padding:16px}
.card{background:white;padding:18px;margin:14px 0;border-radius:15px}
button{background:#5146e5;color:white;border:0;padding:12px;border-radius:8px;margin:4px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;box-sizing:border-box;margin:8px 0;border:1px solid #ccc;border-radius:8px}
#output{white-space:pre-wrap;background:#f1f0ff;padding:12px;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>📚 Study Buddy</h1>
<p>Your Personal Learning Companion</p>
</header>
<main>
<div class="card">
<h2>👋 Welcome to Study Buddy</h2>
<input id="name" placeholder="Enter your name">
<button onclick="welcome()">Start Learning</button>
<p id="greeting"></p>
</div>

<div class="card">
<h2>📖 Study Notes</h2>
<select id="subject" onchange="notes()">
<option value="science">Class 10 Science</option>
<option value="biology">Life Processes</option>
<option value="maths">Mathematics</option>
</select>
<div id="output">Choose a subject to see notes.</div>
</div>

<div class="card">
<h2>📝 Quick Quiz</h2>
<p>Which organ pumps blood throughout the human body?</p>
<button onclick="answer(true)">Heart</button>
<button onclick="answer(false)">Lungs</button>
<p id="quizResult"></p>
</div>

<div class="card">
<h2>📅 Study Planner</h2>
<input id="task" placeholder="Enter your study task">
<button onclick="addTask()">Add Task</button>
<ul id="tasks"></ul>
</div>

<div class="card">
<h2>🤖 Study Tutor Demo</h2>
<textarea id="question" placeholder="Ask about photosynthesis, respiration or arteries"></textarea>
<button onclick="ask()">Ask Tutor</button>
<div id="reply"></div>
</div>
</main>

<script>
function welcome(){
 let n=document.getElementById('name').value.trim();
 document.getElementById('greeting').textContent=n?'Welcome, '+n+'! Happy learning.':'Please enter your name.';
}
function notes(){
 let s=document.getElementById('subject').value;
 let data={
 science:'Science: Study nutrition, respiration, transportation and excretion.',
 biology:'Life Processes: Arteries carry blood away from the heart. Veins carry blood towards the heart. Capillaries exchange substances with tissues.',
 maths:'Mathematics: Revise formulas, practise examples and check your calculations.'
 };
 document.getElementById('output').textContent=data[s];
}
function answer(correct){
 document.getElementById('quizResult').textContent=correct?'Correct! Well done!':'Try again. The correct answer is Heart.';
}
function addTask(){
 let el=document.getElementById('task');
 let value=el.value.trim();
 if(!value){alert('Enter a task first.');return;}
 let li=document.createElement('li');
 li.textContent=value+' ';
 let b=document.createElement('button');
 b.textContent='Done';
 b.onclick=()=>{li.style.textDecoration='line-through';b.remove();};
 li.appendChild(b);
 document.getElementById('tasks').appendChild(li);
 el.value='';
}
function ask(){
 let q=document.getElementById('question').value.toLowerCase();
 let r='This is a basic demo tutor. Try asking about photosynthesis, respiration or blood vessels.';
 if(q.includes('photosynthesis'))r='Photosynthesis is the process by which green plants use sunlight, carbon dioxide and water to prepare food.';
 else if(q.includes('respiration'))r='Respiration releases energy from food. Aerobic respiration uses oxygen.';
 else if(q.includes('arter'))r='Arteries carry blood away from the heart and have thick, elastic walls.';
 else if(q.includes('vein'))r='Veins carry blood towards the heart. Valves help prevent backflow.';
 document.getElementById('reply').textContent=r;
}
</script>
</body>
</html>
